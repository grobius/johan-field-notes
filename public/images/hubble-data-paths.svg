<svg xmlns="http://www.w3.org/2000/svg" width="840" height="800" viewBox="0 0 840 800" role="img" aria-labelledby="title desc">
  <title id="title">Two routes for a few bytes</title>
  <desc id="desc">A sensor sends BLE advertisements through a participating phone or gateway, or uses Hubble's satellite protocol to transmit to a passing satellite and ground station. Both routes deliver data through the Hubble backend to an application.</desc>
  <defs>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9ac7ac"/></marker>
    <marker id="amber-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d9b57b"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect x="1" y="1" width="838" height="798" rx="16" fill="#101412" stroke="#35413a" stroke-width="2"/>
  <rect x="2" y="2" width="836" height="796" rx="16" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="420" y="55" fill="#edf1ed" font-size="29" font-weight="700">Two routes for a few bytes</text>
    <text x="420" y="84" fill="#aeb7b3" font-size="18">Hubble Network / simplified data flow</text>
    <rect x="288" y="112" width="264" height="98" rx="10" fill="#1a221d" stroke="#789783"/>
    <g transform="translate(321 137)" fill="none" stroke="#9ac7ac" stroke-width="2.5">
      <rect x="0" y="0" width="32" height="40" rx="4"/><path d="M7 12h18M7 20h18M7 28h10M10-6v6M22-6v6M10 40v6M22 40v6"/>
    </g>
    <text x="444" y="151" fill="#edf1ed" font-size="24" font-weight="700">Sensor device</text>
    <text x="444" y="180" fill="#aeb7b3" font-size="18">2.4 GHz radio</text>

    <path d="M350 210v32H215v15m0 28v13" fill="none" stroke="#9ac7ac" stroke-width="2" marker-end="url(#green-arrow)"/>
    <path d="M490 210v32h135v15m0 28v13" fill="none" stroke="#d9b57b" stroke-width="2" marker-end="url(#amber-arrow)"/>
    <text x="215" y="280" fill="#9ac7ac" font-size="18">BLE advertisements</text>
    <text x="625" y="280" fill="#d9b57b" font-size="18">Hubble satellite protocol</text>

    <rect x="55" y="309" width="320" height="100" rx="10" fill="#18211c" stroke="#567463"/>
    <g transform="translate(83 334)" fill="none" stroke="#9ac7ac" stroke-width="2.5"><rect width="26" height="46" rx="5"/><path d="M7 7h12M9 38h8"/></g>
    <text x="240" y="350" fill="#edf1ed" font-size="23" font-weight="700">Phone / gateway</text>
    <text x="240" y="380" fill="#aeb7b3" font-size="18">Participating receiver nearby</text>

    <rect x="465" y="309" width="320" height="100" rx="10" fill="#252118" stroke="#927c54"/>
    <g transform="translate(488 342)" fill="none" stroke="#d9b57b" stroke-width="2.3"><rect x="14" y="4" width="20" height="27" rx="2"/><path d="M0 7h14v20H0zM34 7h14v20H34zM24 4V-4M20-4h8"/></g>
    <text x="652" y="350" fill="#edf1ed" font-size="23" font-weight="700">Passing satellite</text>
    <text x="652" y="380" fill="#c0b5a2" font-size="18">Outdoor view of the sky</text>

    <path d="M625 409v49" fill="none" stroke="#d9b57b" stroke-width="2" marker-end="url(#amber-arrow)"/>
    <rect x="465" y="470" width="320" height="64" rx="10" fill="#252118" stroke="#927c54"/>
    <text x="625" y="510" fill="#edf1ed" font-size="23">Ground station</text>
    <text x="215" y="463" fill="#9ac7ac" font-size="18">Internet connection</text>
    <path d="M215 409v34m0 32v80q0 20 20 20h120v24" fill="none" stroke="#9ac7ac" stroke-width="2" marker-end="url(#green-arrow)"/>
    <path d="M625 534v21q0 20-20 20H485v24" fill="none" stroke="#d9b57b" stroke-width="2" marker-end="url(#amber-arrow)"/>

    <rect x="265" y="610" width="310" height="62" rx="10" fill="#1a221d" stroke="#789783"/>
    <text x="420" y="649" fill="#edf1ed" font-size="24" font-weight="700">Hubble backend</text>
    <path d="M420 672v39" fill="none" stroke="#9ac7ac" stroke-width="2" marker-end="url(#green-arrow)"/>
    <text x="535" y="698" fill="#aeb7b3" font-size="18">API / webhook</text>
    <rect x="265" y="722" width="310" height="52" rx="10" fill="#1a221d" stroke="#789783"/>
    <text x="420" y="756" fill="#edf1ed" font-size="23">Your application</text>
  </g>
</svg>
